name: Snapwell
options:
  bundleIdPrefix: co.snapwell
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

fileTypes:
  icon:
    buildPhase: resources
    type: folder
    file:
      lastKnownFileType: folder.iconcomposer.icon

configs:
  Debug: debug
  Automation: debug
  Release: release

settings:
  base:
    ALWAYS_SEARCH_USER_PATHS: NO
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: "HJ4HYUU2Y6"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES
  configs:
    Debug:
      ENABLE_TESTABILITY: YES
      GCC_OPTIMIZATION_LEVEL: 0
      ONLY_ACTIVE_ARCH: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Automation:
      ENABLE_TESTABILITY: YES
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG SNAPWELL_AUTOMATION
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
      ENABLE_HARDENED_RUNTIME: NO
    Release:
      DEBUG_INFORMATION_FORMAT: dwarf-with-dsym
      ENABLE_NS_ASSERTIONS: NO
      SWIFT_COMPILATION_MODE: wholemodule
      SWIFT_OPTIMIZATION_LEVEL: "-O"

targets:
  Snapwell:
    type: application
    platform: macOS
    attributes:
      DevelopmentTeam: HJ4HYUU2Y6
      ProvisioningStyle: Automatic
    sources:
      - path: Snapwell
        excludes:
          - "**/.DS_Store"
      - path: ../Tests/Fixtures/clip.mp4
        buildPhase: resources
      - path: ../Shared
        excludes:
          - "**/.DS_Store"
    info:
      path: Snapwell/Resources/Info.plist
      properties:
        CFBundleDisplayName: Snapwell
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "Copyright © 2026 Snapwell"
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Snapwell accesses your photo library to import and organize your photos and videos. For example, you can select images from your library to add them to Snapwell for AI-powered analysis and categorization."
        NSAppleMusicUsageDescription: "Snapwell accesses your media library to browse and import photos and videos you have saved. For example, you can import images from your media library to organize them into visual collections."
        NSLocalNetworkUsageDescription: "Snapwell connects to Ollama running on this Mac to analyze your media locally."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSUbiquitousContainers:
          iCloud.co.SnapWell:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: Snapwell
    settings:
      base:
        PRODUCT_NAME: Snapwell
        PRODUCT_MODULE_NAME: Snapwell
        PRODUCT_BUNDLE_IDENTIFIER: co.snapwell
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
        MARKETING_VERSION: "1.0.7"
        CURRENT_PROJECT_VERSION: 14
        CODE_SIGN_ENTITLEMENTS: Snapwell/Resources/Snapwell.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: none
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
      configs:
        Debug:
          EXCLUDED_SOURCE_FILE_NAMES: clip.mp4
        Release:
          EXCLUDED_SOURCE_FILE_NAMES: clip.mp4
        Automation:
          PRODUCT_BUNDLE_IDENTIFIER: co.snapwell.automation
          EXCLUDED_SOURCE_FILE_NAMES: AppIcon.icon
          ASSETCATALOG_COMPILER_APPICON_NAME: ""
          CODE_SIGN_ENTITLEMENTS: Automation.entitlements

  SnapwellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnapwellTests
        excludes:
          - "**/.DS_Store"
      - path: ../Tests/Compatibility
      - path: ../Tests/Fixtures/sidecar.json
        buildPhase: resources
      - path: ../Tests/Fixtures/spaces.json
        buildPhase: resources
    dependencies:
      - target: Snapwell
    settings:
      base:
        PRODUCT_NAME: SnapwellTests
        PRODUCT_MODULE_NAME: SnapwellTests
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snapwell.app/Contents/MacOS/Snapwell"
        PRODUCT_BUNDLE_IDENTIFIER: co.snapwell.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"

  SnapwellUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: ../Tests/UI
    dependencies:
      - target: Snapwell
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.snapwell.automation.uitests
        TEST_TARGET_NAME: Snapwell

schemes:
  Snapwell:
    build:
      targets:
        Snapwell: all
    test:
      config: Automation
      targets:
        - SnapwellTests
        - SnapwellUITests
