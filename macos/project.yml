name: Snapwell
options:
  bundleIdPrefix: co.snapwell
  deploymentTarget:
    macOS: "15.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

fileTypes:
  icon:
    buildPhase: resources
    type: folder
    file:
      lastKnownFileType: folder.iconcomposer.icon

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "15.0"
    DEVELOPMENT_TEAM: "HJ4HYUU2Y6"
    CODE_SIGN_IDENTITY: "Apple Development"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

targets:
  Snapwell:
    type: application
    platform: macOS
    attributes:
      DevelopmentTeam: HJ4HYUU2Y6
      ProvisioningStyle: Automatic
    sources:
      - path: Snapwell
        excludes:
          - "**/.DS_Store"
      - path: ../shared
    info:
      path: Snapwell/Resources/Info.plist
      properties:
        CFBundleDisplayName: Snapwell
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.photography
        NSHumanReadableCopyright: "Copyright © 2026 Snapwell"
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: "Snapwell accesses your photo library to import and organize your photos and videos. For example, you can select images from your library to add them to Snapwell for AI-powered analysis and categorization."
        NSAppleMusicUsageDescription: "Snapwell accesses your media library to browse and import photos and videos you have saved. For example, you can import images from your media library to organize them into visual collections."
        NSUbiquitousContainers:
          iCloud.co.SnapWell:
            NSUbiquitousContainerIsDocumentScopePublic: true
            NSUbiquitousContainerSupportedFolderLevels: Any
            NSUbiquitousContainerName: Snapwell
    settings:
      base:
        PRODUCT_NAME: Snapwell
        PRODUCT_MODULE_NAME: Snapwell
        ENABLE_TESTABILITY: YES
        PRODUCT_BUNDLE_IDENTIFIER: co.snapwell
        MARKETING_VERSION: "1.0.2"
        CURRENT_PROJECT_VERSION: 6
        CODE_SIGN_ENTITLEMENTS: Snapwell/Resources/Snapwell.entitlements
        SWIFT_STRICT_CONCURRENCY: complete
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_STANDALONE_ICON_BEHAVIOR: none
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
    entitlements:
      path: Snapwell/Resources/Snapwell.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.developer.ubiquity-container-identifiers:
          - iCloud.co.SnapWell
        keychain-access-groups:
          - $(TeamIdentifierPrefix)co.snapwell.shared

  SnapwellTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: SnapwellTests
        excludes:
          - "**/.DS_Store"
    dependencies:
      - target: Snapwell
    settings:
      base:
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "15.0"
        BUNDLE_LOADER: "$(TEST_HOST)"
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Snapwell.app/Contents/MacOS/Snapwell"
        PRODUCT_NAME: SnapwellTests
        PRODUCT_MODULE_NAME: SnapwellTests
        PRODUCT_BUNDLE_IDENTIFIER: co.snapwell.tests
        SWIFT_STRICT_CONCURRENCY: complete
        GENERATE_INFOPLIST_FILE: "YES"
